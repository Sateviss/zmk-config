# Right half only (applied after splitkb_aurora_lily58.conf).
#
# This half is always powered by a power-only cable, so it never sees USB and would
# otherwise deep-sleep on its own after CONFIG_ZMK_IDLE_SLEEP_TIMEOUT without
# right-hand key presses. Waking it reboots it, the waking key press is lost and it
# has to reconnect to the left half, which feels like a flaky connection.
# Remove this if you ever run the right half on battery alone.
CONFIG_ZMK_SLEEP=n
