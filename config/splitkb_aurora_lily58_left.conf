# Left half (central) only (applied after splitkb_aurora_lily58.conf).
#
# The per-key RGB module relays the right half's indicators (layer key map, held
# modifiers, caps lock) as &prgb commands over the split link: up to 5 per layer change,
# besides the &prgb commands of the lighting keys (2 per press). The queue of commands
# waiting to be sent to the right half drops the oldest when full; the default of 5 is
# too tight for a quick tap of a layer key, so make room.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=16
