# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
# Encoder interrupts are disabled until the handler has read the pins. On the global
# (system work queue) thread that read waits behind OLED redraws over I2C, so a fast
# spin skips quadrature states and gets dropped: only the first detent registers.
# Give the encoders their own thread instead.
CONFIG_EC11_TRIGGER_OWN_THREAD=y
# The encoder thread runs the whole event chain for each step (keymap, HID report,
# waking the underglow/OLEDs). Give it a bigger stack than the 1 KB default, and a
# higher priority than the OLED render thread (5) so redraws can't starve it.
CONFIG_EC11_THREAD_STACK_SIZE=2048
CONFIG_EC11_THREAD_PRIORITY=4


# Uncomment the following line to enable the OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
# Render the OLEDs on their own (lower priority) thread so redraws can't block key
# and encoder handling on the system work queue.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y


# Uncomment the following lines to enable RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
# By default, turning the underglow off (RGB_TOG, or auto-off on idle) also cuts the
# nice!nano's switched VCC rail, which powers the OLEDs too. The SSD1306 is not
# re-initialised when that power comes back, so the screens stay black until a reboot
# (ZMK issue #674). Keep the rail on and let underglow just turn its LEDs off instead.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
# Not disabling without USB bc right half thinks it's on battery power when it's plugged through the TRRS cable
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
# Safe again now that underglow no longer controls the VCC rail
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Orange-yellow
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=15
# Breathe
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=1
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=2

# 34 LEDs per half now (underglow + per-key). Cap brightness at 50% like QMK does for
# this board, to keep current draw and heat sane.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50

# The Aurora has no single-colour PWM backlight; the per-key LEDs are addressable RGB
# and are driven by the underglow chain above. ZMK_BACKLIGHT is a different feature.
CONFIG_ZMK_BACKLIGHT=n

# Idle = OLEDs blank + underglow off; any key press brings them back.
# Deep sleep must be longer than idle (it powers the halves off; a key press on that
# half reboots it and the press itself is lost).
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_PM_SOFT_OFF=n

# Bluetooth: max transmit power (default 0 dBm). Helps both the host link and the
# link between the halves; negligible battery cost.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y