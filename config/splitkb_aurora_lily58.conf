# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
# Encoder interrupts are disabled until the handler has read the pins. On the global
# (system work queue) thread that read waits behind OLED redraws over I2C, so a fast
# spin skips quadrature states and gets dropped: only the first detent registers.
# Give the encoders their own thread instead.
CONFIG_EC11_TRIGGER_OWN_THREAD=y
# The encoder thread runs the whole event chain for each step (keymap, HID report,
# waking the underglow/OLEDs). Give it a bigger stack than the 1 KB default, and a
# higher priority than the OLED render thread (5) so redraws can't starve it.
CONFIG_EC11_THREAD_STACK_SIZE=2048
CONFIG_EC11_THREAD_PRIORITY=4


# Uncomment the following line to enable the OLED Display
CONFIG_ZMK_DISPLAY=y
# Status screen from this repo's module (src/display/): portrait, turned 90 degrees
# clockwise, with battery voltage, lighting effect + brightness, connection and (left)
# layer. To turn it the other way: CONFIG_ZMK_OLED_STATUS_ROTATE_CCW=y.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_OLED_STATUS=y
CONFIG_ZMK_OLED_STATUS_ROTATE_CW=y
# LVGL theme default font: one the screen uses anyway (otherwise Unscii 8 gets linked)
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y
# Render the OLEDs on their own (lower priority) thread so redraws can't block key
# and encoder handling on the system work queue.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y


# Lighting: per-key RGB module from this repo (Kconfig, src/) instead of ZMK's RGB
# underglow. It drives the same 34-LED chain per half as two zones: underglow (LEDs 0-4)
# and keys (5-33), each with its own colour, plus reactive effects. Controlled with
# &prgb on the control layer. ZMK's underglow must stay off: both drive the same strip.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_PRGB=y
# The module never touches the nice!nano's switched VCC rail (ext_power): that rail
# also powers the OLEDs, and the SSD1306 is not re-initialised when it comes back (ZMK
# issue #674). Off / idle just blanks the LEDs.
CONFIG_ZMK_PRGB_AUTO_OFF_IDLE=y
# Cap brightness at 50% like QMK does for this board, to keep current draw and heat
# sane with 34 LEDs per half. The brightness setting (0-100) is scaled to this.
# This is the starting cap: MAX+/MAX- on the Control layer move it (saved) between
# BRT_MAX_MIN and BRT_MAX_CEIL in BRT_MAX_STEP steps.
CONFIG_ZMK_PRGB_BRT_MAX=50
CONFIG_ZMK_PRGB_BRT_MAX_MIN=10
CONFIG_ZMK_PRGB_BRT_MAX_CEIL=100
CONFIG_ZMK_PRGB_BRT_MAX_STEP=10
CONFIG_ZMK_PRGB_BRT_START=100
# Underglow orange-yellow (also the accent colour of the reactive effects), keys white
CONFIG_ZMK_PRGB_UG_HUE_START=15
CONFIG_ZMK_PRGB_UG_SAT_START=100
CONFIG_ZMK_PRGB_KEY_HUE_START=0
CONFIG_ZMK_PRGB_KEY_SAT_START=0
# 0 static, 1 breathe (underglow breathes, keys static), 2 reactive, 3 ripple, 4 rainbow,
# 5 heatmap
CONFIG_ZMK_PRGB_EFF_START=1
CONFIG_ZMK_PRGB_SPD_START=3
# Reactive/ripple: pressed keys light in the accent (underglow) colour and fade out
# over ~1 s (at speed 3). Keys rest dark (background 0%); PRGB_BG_NEXT raises the rest
# level to a dim tint of the accent colour (5, 10, 15, 25%).
CONFIG_ZMK_PRGB_FADE_MS=1000
CONFIG_ZMK_PRGB_BG_START=0
# Frame rate while animating; static effects write the LEDs once and stop the timer
CONFIG_ZMK_PRGB_FPS=40
# Indicators (both default on, toggled with PRGB_MAP_TOG / PRGB_PULSE_TOG and saved):
# - layer key map: on a layer above Base the keys light by what is bound to them there
#   (white keys, orange layer, blue bt/out, red system, dark &none; lighting keys by
#   function: brightness yellow, saturation purple, hue rainbow, effect green, speed
#   cyan, toggles pink; the &none keys flash a colour/brightness just changed), the
#   BT_SEL keys by profile state and the &out key by endpoint; the underglow takes the
#   layer's tint (Control blue, Extra purple). The left half relays the right's map.
# - held modifiers light their keys green and caps lock its key cyan, on any layer.
# - underglow pulse: rests at half level and flashes to full on each key press of that
#   half, ~400 ms at speed 3.
CONFIG_ZMK_PRGB_MAP_START=y
CONFIG_ZMK_PRGB_PULSE_START=y
CONFIG_ZMK_PRGB_PULSE_MS=400
# Caps lock with no &kp CAPS on the active layers lights the key bound to it on another
# layer (Extra's CAPS = position 12); without any, position 24 (left outer home row).
CONFIG_ZMK_PRGB_CAPS_FALLBACK_POS=24
# Caps lock state comes from the host's keyboard LED report, which needs ZMK's HID
# indicators (adds an LED output report to the HID descriptor: a Bluetooth host that
# cached the old descriptor may need the keyboard removed and paired again to send it).
CONFIG_ZMK_HID_INDICATORS=y
# The lighting renders frames and works out the indicators (keymap walk, split relay
# into ZMK's send queue) on ZMK's low priority work queue; give it headroom over the
# 768-byte default so a deeper call chain can't overflow it.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=1536

# The Aurora has no single-colour PWM backlight; the per-key LEDs are addressable RGB
# and are driven by the per-key RGB module above. ZMK_BACKLIGHT is a different feature.
CONFIG_ZMK_BACKLIGHT=n

# Idle = OLEDs blank + LEDs off; any key press brings them back.
# Deep sleep must be longer than idle (it powers the halves off; a key press on that
# half reboots it and the press itself is lost).
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_PM_SOFT_OFF=n

# Bluetooth: max transmit power (default 0 dBm). Helps both the host link and the
# link between the halves; negligible battery cost.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y